[package]
name = "eka-ls"
version = "0.5.9"
edition = "2024"
rust-version = "1.88"
description = "A modern replacement for ls with GNU-compatible output (installs the eka command)"
authors = ["Eka Contributors"]
license = "MIT"
repository = "https://github.com/alexlm78/eka"
readme = "README.md"
keywords = ["ls", "cli", "coreutils", "terminal", "filesystem"]
categories = ["command-line-utilities", "filesystem"]

[build-dependencies]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
uzers = "0.12.2"
terminal_size = "0.4.4"
xattr = "1.6.1"
clap_complete = "4.6.11"

[[bin]]
name = "eka"
path = "src/main.rs"

[package.metadata.man]
sections = ["user-utils"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
