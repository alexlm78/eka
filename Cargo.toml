[package]
name = "eka"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A modern replacement for ls with colors"
authors = ["Eka Contributors"]
license = "MIT"
repository = "https://github.com/alexlm78/eka"
readme = "README.md"

[build-dependencies]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
uzers = "0.12.2"
terminal_size = "0.4.4"
xattr = "1.6.1"

[[bin]]
name = "eka"
path = "src/main.rs"

[package.metadata.man]
sections = ["user-utils"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
